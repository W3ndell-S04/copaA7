<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Artilharia Completa | Copa Área 7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-blue: #002147; --bg-light: #f4f7f6; }
        body { background-color: var(--bg-light); font-family: 'Montserrat', sans-serif; }
        .header-artilharia { background: var(--primary-blue); color: white; padding: 40px 0; margin-bottom: 30px; border-radius: 0 0 20px 20px; }
        .player-card { background: white; border-radius: 12px; margin-bottom: 10px; transition: 0.3s; border: 1px solid #eee; }
        .player-card:hover { transform: scale(1.01); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .rank-number { font-size: 1.5rem; font-weight: 900; color: #ccc; width: 50px; text-align: center; }
        .rank-1 { color: #ffd700; } /* Dourado para o 1º */
        .foto-perfil { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; background: #eee; }
        .gols-count { background: var(--primary-blue); color: white; padding: 10px 20px; border-radius: 10px; font-weight: 800; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="header-artilharia text-center">
    <h1 class="fw-bold">ARTILHARIA DO CAMPEONATO</h1>
    <p class="mb-0 opacity-75">Quem balançou as redes na Copa Área 7</p>
</div>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <a href="/" class="btn btn-sm btn-outline-secondary mb-4"><i class="fas fa-arrow-left"></i> Voltar para Home</a>
            
            {% for artilheiro in artilheiros %}
            <div class="player-card p-3 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <div class="rank-number {% if forloop.first %}rank-1{% endif %}">
                        {{ forloop.counter }}º
                    </div>
                    <img src="{{ artilheiro.foto|default:'https://via.placeholder.com/60' }}" class="foto-perfil mx-3 shadow-sm">
                    <div>
                        <h5 class="mb-0 fw-bold text-dark">{{ artilheiro.nome|upper }}</h5>
                        <small class="text-muted">{{ artilheiro.time.nome }}</small>
                    </div>
                </div>
                <div class="text-center">
                    <div class="gols-count">{{ artilheiro.gols }}</div>
                    <small class="text-muted fw-bold" style="font-size: 10px;">GOLS</small>
                </div>
            </div>
            {% empty %}
            <div class="alert alert-light text-center">Nenhum gol marcado até o momento.</div>
            {% endfor %}
        </div>
    </div>
</div>

</body>
</html>
